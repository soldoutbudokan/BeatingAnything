<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeatingAnything</title>
<meta name="description" content="Team ratings read off betting-market prices every hour, and bottom-up IPL, Test, ODI and WNBA projection models you can open like spreadsheets.">
<link rel="stylesheet" href="assets/sheet.css?v=2">
<script src="assets/sheet.js?v=2"></script>
<style>
/* Contents: page-specific additions on top of assets/sheet.css (tokens only). */
.ct-cover{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding:4px 2px 2px}
.ct-cover h1{font-size:26px;letter-spacing:-.025em;margin:0;line-height:1.15}
.ct-cover p{margin:6px 0 0;color:var(--ink2);max-width:76ch;font-size:14px}
.ct-figs{display:flex;gap:0;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
.ct-figs div{padding:8px 14px;border-right:1px solid var(--rule);min-width:0}
.ct-figs div:last-child{border-right:0}
.ct-figs b{display:block;font-size:18px;letter-spacing:-.01em;font-weight:600;font-variant-numeric:tabular-nums}
.ct-figs span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ct-books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.ct-book{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:4px;min-width:0;transition:border-color .1s,box-shadow .1s}
.ct-book:hover{border-color:var(--base);box-shadow:var(--shadow)}
.ct-bh{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;text-decoration:none;color:inherit}
.ct-ic{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;flex:0 0 auto;background:var(--sel);color:var(--accent)}
.ct-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ct-bt{min-width:0;flex:1}
.ct-bt h2{font-size:15px;margin:0;letter-spacing:-.01em}
.ct-bt p{margin:1px 0 0;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-open{font-size:12px;color:var(--accent);white-space:nowrap;font-weight:500}
.ct-bh:hover .ct-open{text-decoration:underline}
.ct-status{display:flex;align-items:center;gap:7px;padding:0 14px 10px;font:11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the miniature sheet inside each card */
.ct-mini{margin:0 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
.ct-mini table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.ct-mini th{height:20px;background:var(--chrome);color:var(--muted);font:500 10.5px var(--mono);border-right:1px solid var(--rule);border-bottom:1px solid var(--base);text-align:center}
.ct-mini td{height:29px;padding:0 7px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-mini tr:last-child td{border-bottom:0}
.ct-mini td:last-child,.ct-mini th:last-child{border-right:0}
.ct-mini td.g,.ct-mini th.g{width:26px;background:var(--chrome);color:var(--muted);font:10.5px var(--mono);text-align:center;padding:0;border-right:1px solid var(--rule)}
.ct-mini td.n{text-align:right}
.ct-mini td.lg{color:var(--muted);font-size:11px}
.ct-mini tr.hot td:not(.g){background:var(--sel)}
.ct-mini tr.hd td{height:24px;font-weight:600;font-size:11px;color:var(--ink2)}
.ct-mini .tm span{font-size:11.5px}
.ct-bar{display:flex;align-items:center;gap:6px}
.ct-bar i{height:8px;border-radius:2px;background:var(--div-pos);flex:0 0 auto}
.ct-bar i.n{background:var(--div-neg)}
.ct-bar b{font-weight:500;margin-left:auto}
.ct-sheets{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 12px;margin-top:auto}
.ct-sheets a{font-size:11.5px;padding:2px 8px;border:1px solid var(--rule);border-radius:3px;color:var(--ink2);text-decoration:none;background:var(--chrome);white-space:nowrap}
.ct-sheets a:hover{border-color:var(--accent);color:var(--accent)}
.ct-week{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
@media (max-width:1000px){.ct-week{grid-template-columns:minmax(0,1fr)}}
.ct-card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px 14px 12px;min-width:0}
.ct-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.ct-hd a{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.ct-hd a:hover{text-decoration:underline}
.ct-row{display:grid;align-items:center;gap:10px;height:32px;border-bottom:1px solid var(--rule);font-size:12.5px;font-variant-numeric:tabular-nums;text-decoration:none;color:inherit}
.ct-row:last-child{border-bottom:0}
a.ct-row:hover{background:var(--hover)}
.ct-mv{grid-template-columns:minmax(0,1.2fr) 44px minmax(0,1fr) 46px}
.ct-tag{font:500 10.5px var(--mono);color:var(--muted)}
.ct-mvb{position:relative;height:10px}
.ct-mvb::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;border-left:1px solid var(--axis)}
.ct-mvb i{position:absolute;top:0;bottom:0;border-radius:2px}
.ct-mvb i.p{background:var(--div-pos)}.ct-mvb i.n{background:var(--div-neg)}
.ct-v{text-align:right;font-weight:600}
.ct-gm{grid-template-columns:86px 40px minmax(0,1fr) 128px 46px}
.ct-gm .at{color:var(--muted);margin:0 5px}
.ct-pb{display:flex;align-items:center;gap:6px}
.ct-pb span{flex:1;height:8px;border-radius:2px;background:var(--bar-neg);position:relative;overflow:hidden}
.ct-pb span i{position:absolute;right:0;top:0;bottom:0;background:var(--div-pos)}
.ct-pb b{font-weight:500;width:42px;text-align:right}
@media (max-width:600px){.ct-gm{grid-template-columns:40px minmax(0,1fr) 104px 42px}.ct-gm .c-when{display:none}.ct-figs{width:100%}.ct-figs div{flex:1}}
.ct-foot{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;margin-top:2px}
.ct-foot a{color:var(--ink2)}
/* archive */
.ct-arch .sh-tbl td{height:38px;white-space:normal}
.ct-arch .sh-tbl a{color:var(--accent);text-decoration:none;font-weight:500}
.ct-arch .sh-tbl a:hover{text-decoration:underline}
</style>
</head>
<body>
<noscript>This page needs JavaScript.</noscript>
<script>
'use strict';
const S = Sheets, h = S.h, esc = S.esc, SITE = S.site;
const isNum = v => typeof v === 'number' && isFinite(v);
const pct = (v, d = 1) => isNum(v) ? (100 * v).toFixed(d) + '%' : '–';
const signed = (v, d = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) : '–';
const whenShort = iso => new Date(iso).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});
const mdy = s => s ? new Date(String(s).slice(0, 10) + 'T12:00:00Z').toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';
const ago = iso => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
const doc = id => SITE.docs.find(d => d.id === id);
const ICONS = {
  power: '<svg viewBox="0 0 20 20"><path d="M3 16V9M8 16V5M13 16v-5M18 16V3"/></svg>',
  ipl: '<svg viewBox="0 0 20 20"><path d="M5 6.6V17M9 6.6V17M13 6.6V17M4.4 4.6h4.2M9.4 4.6h4.2"/><circle cx="16.6" cy="15.4" r="1.7" fill="currentColor" stroke="none"/></svg>',
  test: '<svg viewBox="0 0 20 20"><path d="M10 2.6v3.6M7.7 6.2h4.6v8.9a2.3 2.3 0 0 1-4.6 0z"/></svg>',
  odi: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M6.3 4.9c2.1 3 2.1 7.2 0 10.2M13.7 4.9c-2.1 3-2.1 7.2 0 10.2"/></svg>',
  wnba: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M3.5 10h13M10 3.5v13M5.4 5.4c2.6 2.6 2.6 6.6 0 9.2M14.6 5.4c-2.6 2.6-2.6 6.6 0 9.2"/></svg>',
};

// power.json: the copy served with the page waits for a Pages deploy, the raw file on main is fresher. Use the newer.
async function loadPower() {
  const urls = ['power/data/power.json?t=' + Math.floor(Date.now() / 300000)];
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/), repo = location.pathname.split('/')[1];
  if (m && repo) urls.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/main/docs/power/data/power.json`);
  const got = await Promise.all(urls.map(u => fetch(u, {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null)));
  return got.filter(d => d && d.generated_utc && d.leagues).sort((a, b) => b.generated_utc.localeCompare(a.generated_utc))[0] || null;
}
const data = Promise.all([
  loadPower(),
  S.load.optional('models/ipl/data/teams.json'), S.load.optional('models/ipl/data/meta.json'),
  S.load.optional('models/wnba/data/teams.json'), S.load.optional('models/wnba/data/meta.json'),
  S.load.optional('models/test/data/schedule.json'), S.load.optional('models/test/data/teams.json'), S.load.optional('models/test/data/meta.json'),
  S.load.optional('models/odi/data/schedule.json'), S.load.optional('models/odi/data/teams.json'), S.load.optional('models/odi/data/meta.json'),
]).then(([power, iplT, iplM, wnbaT, wnbaM, testS, testT, testM, odiS, odiT, odiM]) => ({power, iplT, iplM, wnbaT, wnbaM, testS, testT, testM, odiS, odiT, odiM}));

/* ───────── workbook cards ───────── */
const LETTERS = n => Array.from({length: n}, (_, i) => S.colName(i));
function mini(cols, rows, hot) {
  // cols: [{label, w, cls}] ; rows: arrays of cell html. Row 1 holds the column labels, as in a real sheet.
  return `<div class="ct-mini"><table><colgroup><col style="width:26px">${cols.map(c => `<col${c.w ? ` style="width:${c.w}"` : ''}>`).join('')}</colgroup>
    <thead><tr><th class="g"></th>${LETTERS(cols.length).map(l => `<th>${l}</th>`).join('')}</tr></thead>
    <tbody><tr class="hd"><td class="g">1</td>${cols.map(c => `<td class="${c.cls || ''}">${esc(c.label || '')}</td>`).join('')}</tr>
    ${rows.map((r, i) => `<tr${hot === i ? ' class="hot"' : ''}><td class="g">${i + 2}</td>${r.map((c, j) => `<td class="${cols[j].cls || ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const bar = (v, max, txt, neg) => `<span class="ct-bar"><i class="${neg ? 'n' : ''}" style="width:${Math.max(2, Math.abs(v) / max * 64).toFixed(0)}px"></i><b>${txt}</b></span>`;
function card(id, sub, status, preview, extra) {
  // A browser can hold an older assets/sheet.js for a few minutes after a deploy; a workbook that copy does not
  // list yet is left out rather than breaking the page.
  const d = doc(id);
  if (!d) return '';
  const base = SITE.root + d.path;
  return `<article class="ct-book">
    <a class="ct-bh" href="${base}"><span class="ct-ic">${ICONS[id]}</span><span class="ct-bt"><h2>${esc(d.title)}</h2><p>${esc(sub)}</p></span><span class="ct-open">Open →</span></a>
    <div class="ct-status">${status}</div>${preview}
    <nav class="ct-sheets" aria-label="${esc(d.title)} sheets">${(extra || []).join('')}${d.sheets.map(([sid, n]) => `<a href="${base}#sheet=${sid}">${esc(n)}</a>`).join('')}</nav></article>`;
}
function powerCard(P) {
  if (!P) return card('power', 'NFL, NBA and NHL ratings from market prices', 'No data yet', '<p class="sh-note" style="padding:0 14px">power.json could not be loaded.</p>');
  const rows = [];
  for (const lg of Object.values(P.leagues)) for (const t of lg.teams.slice(0, 2)) rows.push([esc(lg.label), S.team(t, {name: true}), bar(t.wp - 0.5, 0.35, pct(t.wp))]);
  const stale = (Date.now() - new Date(P.generated_utc)) / 3.6e6 > 3;
  return card('power', 'NFL, NBA and NHL ratings read off game prices', `<i class="sh-live" ${stale ? 'style="background:var(--warn)"' : ''}></i>Updated ${ago(P.generated_utc)} · rebuilt hourly`,
    mini([{label: 'League', w: '58px', cls: 'lg'}, {label: 'Team'}, {label: 'Rating', w: '118px', cls: 'n'}], rows, 0));
}
function iplCard(T, M) {
  if (!T) return card('ipl', 'Ball-by-ball ratings and T20 match simulator', 'Not published', '');
  const C = SITE.colors.ipl, teams = T.teams.slice().sort((a, b) => a.rating.rank - b.rating.rank);
  const mx = Math.max(...teams.map(t => Math.abs(t.rating.win_pct_neutral - 0.5)));
  const rows = teams.slice(0, 5).map(t => [S.team({abbr: t.short, name: t.name, color: C[t.short]}, {name: true}), bar(t.rating.win_pct_neutral - 0.5, mx, pct(t.rating.win_pct_neutral), t.rating.win_pct_neutral < 0.5), `<span class="${t.rating.net_runs >= 0 ? 'up' : 'down'}">${signed(t.rating.net_runs)}</span>`]);
  const c = M && M.counts;
  return card('ipl', 'Ball-by-ball cricket ratings and match simulator', `Built ${esc(mdy(M && M.build_utc))} · data to ${esc(mdy(M && M.data_cutoff))}${c ? ` · ${(c.deliveries / 1e6).toFixed(2)}M balls` : ''}`,
    mini([{label: 'Team'}, {label: 'Win % vs field', w: '118px', cls: 'n'}, {label: 'Net runs', w: '64px', cls: 'n'}], rows, 0));
}
// Test and ODI cards preview the next fixtures the model has simulated: first-named side, draw (Tests), second-named side.
function cricketCard(id, Sch, T, M) {
  const test = id === 'test', sub = test ? 'Upcoming Tests, ratings and a five-day match simulator' : 'Upcoming ODIs, ratings and a 50-over match simulator';
  if (!Sch || !T) return card(id, sub, 'Not published', '');
  const short = Object.fromEntries(T.teams.map(t => [t.name, t.short]));
  const fx = Sch.fixtures.filter(f => f.modelled && f.proj).slice(0, 5);
  if (!doc(id)) return '';
  const base = SITE.root + doc(id).path;
  const rows = fx.map(f => [esc(mdy(f.date)), `<a href="${base}#sheet=match&fx=${encodeURIComponent(f.id)}" style="color:inherit;text-decoration:none"><b>${esc(short[f.A] || f.A)}</b> v <b>${esc(short[f.B] || f.B)}</b> <span class="muted">${esc(f.desc)}</span></a>`,
    pct(f.proj.p_A, 0)].concat(test ? [pct(f.proj.p_draw, 0)] : [], [pct(f.proj.p_B, 0)]));
  const cols = [{label: 'Starts', w: '56px', cls: 'lg'}, {label: 'Match'}, {label: 'Side A', w: '52px', cls: 'n'}].concat(test ? [{label: 'Draw', w: '46px', cls: 'n'}] : [], [{label: 'Side B', w: '52px', cls: 'n'}]);
  const c = M && M.counts;
  return card(id, sub, `Built ${esc(mdy(M && M.build_utc))} · data to ${esc(mdy(M && M.data_cutoff))}${c ? ` · ${(c.deliveries_modelled / 1e6).toFixed(2)}M balls` : ''} · ${Sch.fixtures.length} fixtures`,
    rows.length ? mini(cols, rows) : '<p class="sh-note" style="padding:0 14px">No simulated fixtures in the schedule yet.</p>');
}
function wnbaCard(T, M) {
  if (!T) return card('wnba', 'Player impact ratings and possession simulator', 'Not published', '');
  const teams = T.teams.slice().sort((a, b) => b.net - a.net), mx = Math.max(...teams.map(t => Math.abs(t.net)));
  const rows = teams.slice(0, 5).map(t => [S.team(t, {name: true}), bar(t.net, mx, signed(t.net), t.net < 0), F1(t.ortg), F1(t.drtg)]);
  return card('wnba', 'Player impact ratings and possession simulator', `Built ${esc(mdy(M && M.build_date))} · data to ${esc(mdy(M && M.data_cutoff))}${M && M.n_players_exported ? ` · ${M.n_players_exported} players` : ''}`,
    mini([{label: 'Team'}, {label: 'Net rating', w: '104px', cls: 'n'}, {label: 'ORtg', w: '50px', cls: 'n'}, {label: 'DRtg', w: '50px', cls: 'n'}], rows, 0));
}
const F1 = v => isNum(v) ? v.toFixed(1) : '–';

/* ───────── this week ───────── */
function movers(P) {
  const all = Object.entries(P.leagues).flatMap(([k, lg]) => lg.teams.filter(t => t.d7 != null).map(t => Object.assign({}, t, {lg: lg.label, key: k})));
  const list = all.sort((a, b) => Math.abs(b.d7) - Math.abs(a.d7)).slice(0, 10).sort((a, b) => b.d7 - a.d7);
  const mx = Math.max(0.01, ...list.map(t => Math.abs(t.d7)));
  return `<div class="ct-card"><div class="ct-hd"><h2 class="sh-h">Biggest moves this week</h2><a href="power/">All rankings →</a></div>
    <p class="sh-note" style="margin-bottom:6px">Change in each team's game-market rating over 7 days, percentage points, across the NFL, NBA and NHL.</p>` +
    list.map(t => `<a class="ct-row ct-mv" href="power/#sheet=${t.key}&team=${encodeURIComponent(t.abbr)}">${S.team(t, {name: true})}<span class="ct-tag">${esc(t.lg)}</span><span class="ct-mvb"><i class="${t.d7 >= 0 ? 'p' : 'n'}" style="${t.d7 >= 0 ? 'left:50%' : 'right:50%'};width:${(Math.abs(t.d7) / mx * 50).toFixed(1)}%"></i></span><span class="ct-v ${t.d7 > 0 ? 'up' : 'down'}">${signed(100 * t.d7)}</span></a>`).join('') + '</div>';
}
function nextGames(P) {
  const now = Date.now();
  const all = Object.entries(P.leagues).flatMap(([k, lg]) => { const tm = Object.fromEntries(lg.teams.map(t => [t.abbr, t])); return lg.games.filter(g => new Date(g.start_utc) > now - 3 * 3.6e6).map(g => Object.assign({}, g, {lg: lg.label, key: k, A: tm[g.away] || {abbr: g.away}, H: tm[g.home] || {abbr: g.home}})); });
  all.sort((a, b) => a.start_utc.localeCompare(b.start_utc));
  const list = all.slice(0, 10);
  return `<div class="ct-card"><div class="ct-hd"><h2 class="sh-h">Next games priced</h2><a href="power/#sheet=games">Every venue →</a></div>
    <p class="sh-note" style="margin-bottom:6px">Bar: market chance the home team (second) wins. Last column: what the ratings say, minus the market.</p>` +
    (list.length ? list.map(g => { const d = g.model - g.consensus;
      return `<a class="ct-row ct-gm" href="power/#sheet=games"><span class="c-when muted">${esc(whenShort(g.start_utc))}</span><span class="ct-tag">${esc(g.lg)}</span><span>${S.team(g.A)}<span class="at">${g.neutral ? 'vs' : 'at'}</span>${S.team(g.H)}</span><span class="ct-pb"><span><i style="width:${(100 * g.consensus).toFixed(1)}%"></i></span><b>${pct(g.consensus, 0)}</b></span><span class="ct-v ${Math.abs(d) < 0.03 ? 'muted' : ''}" style="font-weight:500">${signed(100 * d)}</span></a>`;
    }).join('') : '<p class="sh-note">No priced games in the look-ahead window.</p>') + '</div>';
}

/* ───────── sheets ───────── */
async function contents(panel, sheet) {
  const D = await data;
  const P = D.power;
  const teams = P ? Object.values(P.leagues).reduce((n, lg) => n + lg.teams.length, 0) : 0;
  const players = ((D.wnbaM && D.wnbaM.n_players_exported) || 0) + ((D.iplT && D.iplT.teams.reduce((n, t) => n + (t.squad || []).length, 0)) || 0)
    + ((D.testM && D.testM.n_players) || 0) + ((D.odiM && D.odiM.n_players) || 0);
  const games = P ? Object.values(P.leagues).reduce((n, lg) => n + lg.games_fit, 0) : 0;
  panel.append(h('div', {class: 'ct-cover', html: `<div><h1>BeatingAnything</h1><p>Team ratings read off betting-market prices every hour, and four bottom-up player models you can open like spreadsheets. Press <span class="sh-kbd">/</span> to jump to any team, player or sheet.</p></div>
    <div class="ct-figs"><div><b>${teams}</b><span>teams rated hourly</span></div><div><b>${games.toLocaleString()}</b><span>games priced</span></div><div><b>${players.toLocaleString()}</b><span>players modelled</span></div></div>`}));
  panel.append(h('div', {class: 'ct-books', html: powerCard(P) + iplCard(D.iplT, D.iplM) + cricketCard('test', D.testS, D.testT, D.testM) + cricketCard('odi', D.odiS, D.odiT, D.odiM) + wnbaCard(D.wnbaT, D.wnbaM)}));
  if (P) panel.append(h('div', {class: 'ct-week', html: movers(P) + nextGames(P)}));
  panel.append(h('p', {class: 'ct-foot', html: `Research, not advice. Prices are public quotes from Kalshi, Polymarket, Pinnacle and DraftKings; nothing here places or recommends a bet. Methods are on each workbook's Method sheet; dated research is on <a href="${SITE.research}" target="_blank" rel="noopener">GitHub</a>. Older tools are on the <a href="#sheet=archive">Archive</a> sheet.`}));
  if (P) wb.setStamp(`Prices updated ${ago(P.generated_utc)}`);
}
function archive(panel) {
  const rows = [
    ['Early-payout scanner', 'Moneylines where a book\'s early-payout rule turned its price into positive expected value, priced against Pinnacle or the exchanges.', 'Archived November 2026. Not running; no scan was ever published to the site.', 'archive/early-payout/', 'Open archived page'],
    ['Research reports', 'Dated write-ups of every test: what was declared, what ran, and what it found. Latest status: no edge demonstrated.', 'On GitHub', SITE.research, 'reports/'],
    ['Hypothesis cards', 'Ranked ideas, each with a trigger, a sport-side test and the price evidence it needs.', 'On GitHub', SITE.repo + '/tree/main/docs/hypotheses', 'docs/hypotheses/'],
    ['Sheets framework demo', 'Every grid, chart and control used on this site, on synthetic data. For building new workbooks.', 'Reference', 'assets/demo.html', 'Open demo'],
    ['Source code', 'Collectors, models and the site itself.', 'GitHub', SITE.repo, 'Repository'],
  ];
  const el = h('div', {class: 'ct-arch sh-card'});
  S.table(el, [{key: 0, label: 'Item'}, {key: 1, label: 'What it is'}, {key: 2, label: 'Status'}, {key: 3, label: '', render: (v, r) => `<a href="${esc(v)}"${/^https?:/.test(v) ? ' target="_blank" rel="noopener"' : ''}>${esc(r[4])}${/^https?:/.test(v) ? ' ↗' : ' →'}</a>`}],
    rows.map(r => Object.assign({}, r)));
  el.querySelectorAll('tbody td:first-child').forEach(td => { td.style.fontWeight = '600'; });
  panel.append(h('div', {class: 'sh-section'}, h('h2', {class: 'sh-h', text: 'Archive and reference'}), h('p', {class: 'sh-note', text: 'Tools that are no longer running, and the material behind the workbooks.'}), el));
}

const wb = S.workbook({
  title: 'BeatingAnything', subtitle: 'market-implied team ratings and bottom-up player models. Research, not advice.',
  doc: 'contents', defaultSheet: 'contents',
  sheets: [
    {id: 'contents', name: 'Contents', render: contents, about: '<b>Contents</b> <span class="fx-eq">—</span> every workbook on the site, with this week\'s movers and the next games priced. Press / to jump anywhere.'},
    {id: 'archive', name: 'Archive', render: archive, about: '<b>Archive</b> <span class="fx-eq">—</span> retired tools and reference material.'},
  ],
});
