<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power rankings · BeatingAnything</title>
<meta name="description" content="NFL, NBA and NHL power rankings read off Kalshi, Polymarket, Pinnacle and DraftKings prices: each team's win probability against an average opponent on a neutral field.">
<link rel="stylesheet" href="../assets/sheet.css">
<script src="../assets/sheet.js"></script>
<style>
/* Power rankings: page-specific additions on top of ../assets/sheet.css (tokens only). */
.pw-banner{border:1px solid var(--rule);border-left:3px solid var(--warn);background:var(--surface);border-radius:4px;padding:9px 12px;font-size:13px;color:var(--ink2)}
.pw-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.pw-kpi{padding:11px 14px 12px;border-right:1px solid var(--rule);min-width:0}
.pw-kpi:last-child{border-right:0}
.pw-kl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-kv{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:21px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.pw-kv .tm b{font-size:21px}
.pw-ks{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.pw-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.pw-kpi:nth-child(3){border-right:0}.pw-kpi:nth-child(-n+3){border-bottom:1px solid var(--rule)}}
@media (max-width:560px){.pw-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pw-kpi{border-bottom:1px solid var(--rule)}.pw-kpi:nth-child(odd){border-right:1px solid var(--rule)}.pw-kpi:nth-child(even){border-right:0}.pw-kpi:nth-last-child(-n+2){border-bottom:0}.pw-kv{font-size:18px}}
.pw-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.pw-top{grid-template-columns:minmax(0,1fr)}}
.pw-card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px 14px 14px;min-width:0}
.pw-card .sh-note{margin-bottom:8px}
.pw-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pw-hd a{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.pw-hd a:hover{text-decoration:underline}
/* league at a glance: one logo per team on the rating axis, stacked where they would overlap */
.pw-bee{position:relative;margin-top:4px}
.pw-bee .ax{position:absolute;left:0;right:0;bottom:0;height:22px;border-top:1px solid var(--axis)}
.pw-bee .tk{position:absolute;bottom:0;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pw-bee .tk::before{content:"";position:absolute;left:50%;top:-8px;height:5px;border-left:1px solid var(--axis)}
.pw-bee .avg{position:absolute;top:0;bottom:22px;border-left:1px dashed var(--base)}
.pw-bee .avg span{position:absolute;top:0;left:5px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.pw-tm{position:absolute;width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.pw-tm:hover,.pw-tm:focus-visible{transform:scale(1.18);z-index:2;outline:none}
.pw-tm:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.pw-tm img{width:28px;height:28px;object-fit:contain}
.pw-tm .ab{display:none;font-size:9.5px;font-weight:600;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:var(--sunk);border:1px solid var(--base);color:var(--ink)}
.pw-tm.nologo img{display:none}.pw-tm.nologo .ab{display:flex}
/* movers */
.pw-mv{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;align-items:center;gap:8px;height:30px;border-bottom:1px solid var(--rule);font-size:12.5px}
.pw-mv:last-child{border-bottom:0}
.pw-mv button{all:unset;cursor:pointer;min-width:0}
.pw-mv button:hover b{text-decoration:underline}
.pw-mvb{position:relative;height:12px}
.pw-mvb::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;border-left:1px solid var(--axis)}
.pw-mvb i{position:absolute;top:0;bottom:0;border-radius:2px}
.pw-mvb i.p{background:var(--div-pos)}.pw-mvb i.n{background:var(--div-neg)}
.pw-mv .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
/* grid cells */
.pw-dot{display:block;margin-left:auto}
.pw-dot .axl{stroke:var(--grid)}.pw-dot .mid{stroke:var(--base)}
.pw-dot .lk{stroke:var(--base);stroke-width:2;stroke-linecap:round}
.pw-dot .r{fill:var(--model);stroke:var(--surface);stroke-width:1.5}.pw-dot .t{fill:var(--market);stroke:var(--surface);stroke-width:1.5}
.pw-inj .q{color:var(--muted)}
.pw-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink2);align-items:center}
.pw-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* season outlook */
.pw-out{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.pw-out th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--base);text-align:right;white-space:nowrap}
.pw-out th.l,.pw-out td.l{text-align:left}
.pw-out td{padding:0 6px;height:30px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.pw-out td.sd{text-align:center;width:34px;min-width:34px;padding:0;border-left:2px solid var(--surface);background:color-mix(in oklab,var(--heat-seq) calc(var(--p) * 100%),var(--surface))}
.pw-out td.sd.hi{font-weight:600}
.pw-out tr.go{cursor:pointer}.pw-out tr.go:hover td{background-image:linear-gradient(var(--hover),var(--hover))}
.pw-out .grp th{border-bottom:0;text-align:center;padding-bottom:0}
/* games list */
.pw-g{display:grid;grid-template-columns:118px minmax(0,1fr) 150px 56px 56px;align-items:center;gap:10px;height:34px;border-bottom:1px solid var(--rule);font-size:12.5px;font-variant-numeric:tabular-nums}
.pw-g.hd{height:24px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom-color:var(--base)}
.pw-g .n{text-align:right}
.pw-g .at{color:var(--muted);margin:0 6px}
.pw-pb{display:flex;align-items:center;gap:8px}
.pw-pb span{flex:1;height:8px;border-radius:2px;background:var(--bar-neg);position:relative;overflow:hidden}
.pw-pb span i{position:absolute;right:0;top:0;bottom:0;background:var(--div-pos)}
.pw-pb b{font-weight:500;width:44px;text-align:right}
@media (max-width:700px){.pw-g{grid-template-columns:minmax(0,1fr) 96px 48px}.pw-g .c-when,.pw-g .c-rt{display:none}}
/* drawer */
.pw-list{list-style:none;margin:0;padding:0;font-size:12.5px}
.pw-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border-top:1px solid var(--rule)}
.pw-list li:first-child{border-top:0}
.pw-list .muted{white-space:nowrap}
.pw-method{max-width:84ch}
.pw-method p{margin:.7em 0}
.pw-method b{color:var(--ink)}
.pw-src{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;margin-top:6px}
</style>
</head>
<body>
<noscript>This page needs JavaScript.</noscript>
<script>
'use strict';
const S = Sheets, h = S.h, esc = S.esc, F = S.fmt;
const SOURCE = {kalshi: 'Kalshi', polymarket: 'Polymarket', pinnacle: 'Pinnacle', draftkings: 'DraftKings', espn: 'ESPN schedule'};
const VENUES = ['kalshi', 'polymarket', 'pinnacle', 'draftkings'];
const LEAGUES = [['nfl', 'NFL'], ['nba', 'NBA'], ['nhl', 'NHL']];
const state = {data: null, rendered: new Map()};

const isNum = v => typeof v === 'number' && isFinite(v);
const pct = (v, d = 1) => isNum(v) ? (100 * v).toFixed(d) + '%' : '–';
const signed = (v, d = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) : '–';
const when = iso => new Date(iso).toLocaleString(undefined, {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
const whenShort = iso => new Date(iso).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});
const day = d => new Date(d + 'T12:00:00Z').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
const lower = x => (x || '').toLowerCase();
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago';
}
const byAbbr = lg => Object.fromEntries(lg.teams.map(t => [t.abbr, t]));
const mark = (t, o) => S.team(t, o);
const record = sim => sim.otl != null ? `${Math.round(sim.w)}-${Math.round(sim.l)}-${Math.round(sim.otl)}` : sim.w + sim.l > 40 ? `${Math.round(sim.w)}-${Math.round(sim.l)}` : `${sim.w.toFixed(1)}-${sim.l.toFixed(1)}`;
const seedName = (lg, k) => { const s = lg.outlook.seeds[k]; return /^\d+$/.test(s) ? `seed ${s}` : s.startsWith('D') ? `${['1st', '2nd', '3rd'][+s[1] - 1]} in division` : `wild card ${s.slice(2)}`; };
const injText = i => `${i.short}${i.pos ? ' ' + i.pos : ''}${i.out ? '' : '?'}`;
const GROUPS = {nfl: [['Division winners', 4], ['Wild cards', 3]], nba: [['Playoff places', 6], ['Play-in', 4]], nhl: [['Place in division', 3], ['Wild card', 2]]};
const ABOUT = {
  nfl: '<b>Rating</b> <span class="fx-eq">=</span> chance of beating a league-average team on a neutral field, read off NFL game prices and nudged by title odds. Click a team for its card.',
  nba: '<b>Rating</b> <span class="fx-eq">=</span> chance of beating a league-average team on a neutral field, read off NBA game prices and nudged by title odds. Click a team for its card.',
  nhl: '<b>Rating</b> <span class="fx-eq">=</span> chance of beating a league-average team on a neutral field, read off NHL game prices and nudged by title odds. Click a team for its card.',
};

/* ───────── KPI strip ───────── */
function kpis(lg) {
  const withTrend = lg.teams.filter(t => t.d7 != null), top = lg.teams[0];
  const up = withTrend.reduce((a, b) => b.d7 > a.d7 ? b : a, withTrend[0]), down = withTrend.reduce((a, b) => b.d7 < a.d7 ? b : a, withTrend[0]);
  const lift = lg.teams.reduce((a, b) => Math.abs(b.wp - b.game_wp) > Math.abs(a.wp - a.game_wp) ? b : a, top);
  const cell = (label, t, val, sub, cls = '') => `<div class="pw-kpi"><div class="pw-kl">${esc(label)}</div><div class="pw-kv">${t ? mark(t, {size: 26}) : ''}<span class="${cls}">${esc(val)}</span></div><div class="pw-ks">${esc(sub)}</div></div>`;
  return h('div', {class: 'pw-kpis', html: [
    cell('Top rated', top, pct(top.wp), `${top.name}${top.record ? ' · ' + top.record : ''}`),
    up ? cell('Biggest rise, 7 days', up, signed(100 * up.d7), `now ${pct(up.wp)}`, 'up') : '',
    down ? cell('Biggest fall, 7 days', down, signed(100 * down.d7), `now ${pct(down.wp)}`, 'down') : '',
    lift.wp !== lift.game_wp ? cell('Moved most by title odds', lift, signed(100 * (lift.wp - lift.game_wp)), `game lines alone: ${pct(lift.game_wp)}`) : '',
    cell('Home advantage', null, pct(lg.home_adv.wp), lg.home_adv.pts != null ? `about ${lg.home_adv.pts.toFixed(1)} points` : 'home win rate, equal teams'),
    cell('Games priced', null, String(lg.games_fit), `${lg.games_fit - lg.games_upcoming} played · ${lg.games_upcoming} upcoming`),
  ].join('')});
}

/* ───────── league at a glance (logo strip) ───────── */
function glance(lg, key) {
  const box = h('div', {class: 'pw-bee'});
  const L = 30, gap = 3;
  const draw = () => {
    const W = box.clientWidth; if (!W) return;
    const vals = lg.teams.map(t => t.wp);
    let lo = Math.floor(Math.min(...vals) * 10 - 1e-9) / 10, hi = Math.ceil(Math.max(...vals) * 10 + 1e-9) / 10;
    lo = Math.min(lo, 0.4); hi = Math.max(hi, 0.6);
    const x = v => L / 2 + (v - lo) / (hi - lo) * (W - L);
    const lanes = [], placed = [];
    for (const t of lg.teams.slice().sort((a, b) => a.wp - b.wp)) {
      const xx = x(t.wp); let k = 0;
      while (lanes[k] != null && xx - lanes[k] < L + gap) k++;
      lanes[k] = xx; placed.push({t, x: xx, k});
    }
    const H = lanes.length * (L + gap) + 30;
    box.style.height = H + 'px';
    const ticks = []; for (let v = Math.ceil(lo * 10 - 1e-9) / 10; v <= hi + 1e-9; v += 0.1) ticks.push(v);
    box.innerHTML = `<div class="avg" style="left:${x(0.5)}px"><span>average team</span></div><div class="ax"></div>` +
      ticks.map(v => `<span class="tk" style="left:${x(v)}px">${Math.round(v * 100)}%</span>`).join('') +
      placed.map(p => {
        const t = p.t, logo = t.logo ? S.logoUrl(t.logo, 64) : '', dark = t.logo_dark ? S.logoUrl(t.logo_dark, 64) : '';
        return `<button type="button" class="pw-tm${logo ? '' : ' nologo'}" data-abbr="${esc(t.abbr)}" aria-label="${esc(t.name)}, ${pct(t.wp)}" style="left:${(p.x - L / 2).toFixed(1)}px;bottom:${26 + p.k * (L + gap)}px">` +
          (logo ? `<img class="tm-logo${dark ? ' lt' : ''}" src="${esc(logo)}" alt="" loading="lazy" onerror="this.closest('.pw-tm').classList.add('nologo')">` : '') +
          (dark ? `<img class="tm-logo dk" src="${esc(dark)}" alt="" loading="lazy" onerror="this.closest('.pw-tm').classList.add('nologo')">` : '') +
          `<span class="ab">${esc(t.abbr)}</span></button>`;
      }).join('');
  };
  const team = byAbbr(lg);
  box.addEventListener('click', e => { const b = e.target.closest('.pw-tm'); if (b) openTeam(key, b.dataset.abbr); });
  box.addEventListener('pointerover', e => {
    const b = e.target.closest('.pw-tm'); if (!b) return; const t = team[b.dataset.abbr], r = b.getBoundingClientRect();
    S.tip.show(r.right, r.top, S.tip.html(`#${t.rank} ${t.name}`, [{value: pct(t.wp), label: 'rating', key: 'b1'}, {value: signed(100 * (t.d7 ?? NaN)), label: 'pts in 7 days'}, t.record ? {value: t.record, label: 'record'} : null].filter(Boolean)));
  });
  box.addEventListener('pointerout', e => { if (e.target.closest('.pw-tm')) S.tip.hide(); });
  new ResizeObserver(S.debounce(draw, 60)).observe(box);
  requestAnimationFrame(draw);
  return h('div', {class: 'pw-card'},
    h('div', {class: 'pw-hd'}, h('h2', {class: 'sh-h', text: 'The league at a glance'})),
    h('p', {class: 'sh-note', text: 'Every team placed by its rating. Logos stack where teams are within a point or two of each other. Hover for the numbers, click for the team card.'}), box);
}

function movers(lg, key) {
  const list = lg.teams.filter(t => t.d7 != null).sort((a, b) => Math.abs(b.d7) - Math.abs(a.d7)).slice(0, 8).sort((a, b) => b.d7 - a.d7);
  const mx = Math.max(0.01, ...list.map(t => Math.abs(t.d7)));
  const el = h('div', {html: list.map(t => {
    const w = Math.abs(t.d7) / mx * 50;
    return `<div class="pw-mv"><button type="button" data-abbr="${esc(t.abbr)}">${mark(t)}</button><span class="pw-mvb"><i class="${t.d7 >= 0 ? 'p' : 'n'}" style="${t.d7 >= 0 ? 'left:50%' : 'right:50%'};width:${w.toFixed(1)}%"></i></span><span class="v ${t.d7 > 0 ? 'up' : 'down'}">${signed(100 * t.d7)}</span></div>`;
  }).join('')});
  el.addEventListener('click', e => { const b = e.target.closest('button[data-abbr]'); if (b) openTeam(key, b.dataset.abbr); });
  return h('div', {class: 'pw-card'}, h('div', {class: 'pw-hd'}, h('h2', {class: 'sh-h', text: 'Biggest moves, 7 days'})),
    h('p', {class: 'sh-note', text: 'Change in the game-market rating, percentage points.'}), el);
}

/* ───────── rankings grid ───────── */
function dotCell(t, dom) {
  const W = 132, H = 18, p = 6, x = v => p + (v - dom[0]) / (dom[1] - dom[0]) * (W - 2 * p), y = H / 2;
  let s = `<svg class="pw-dot" width="${W}" height="${H}" aria-hidden="true"><line class="axl" x1="${p}" x2="${W - p}" y1="${y}" y2="${y}"/><line class="mid" x1="${x(0.5)}" x2="${x(0.5)}" y1="2" y2="${H - 2}"/>`;
  if (t.title_wp != null) s += `<line class="lk" x1="${x(t.wp)}" x2="${x(t.title_wp)}" y1="${y}" y2="${y}"/><circle class="t" cx="${x(t.title_wp)}" cy="${y}" r="4"/>`;
  return s + `<circle class="r" cx="${x(t.wp)}" cy="${y}" r="5"/></svg>`;
}
function columns(lg, key) {
  const vals = lg.teams.flatMap(t => [t.wp, t.title_wp]).filter(isNum);
  const dom = [Math.floor(Math.min(...vals) * 20 - 1e-9) / 20, Math.ceil(Math.max(...vals) * 20 + 1e-9) / 20];
  const hasPts = lg.teams.some(t => t.pts != null), o = lg.outlook, sim = lg.teams.every(t => t.sim);
  const nhl = key === 'nhl';
  const cols = [
    {key: 'rank', label: '#', frozen: true, width: 40, fmt: 'int', firstDir: 1, agg: null, desc: 'Rank by rating.'},
    {key: 'team', label: 'Team', frozen: true, width: 230, get: t => t.name, render: (v, t) => mark(t, {name: true}), type: 'text', desc: 'Click a team for its card: trend, seed odds, injuries and next games.', csv: (v, t) => t.abbr},
    {key: 'conf', label: 'Conf', group: 'Team', width: 62, type: 'cat', desc: 'Conference.'},
    {key: 'div', label: 'Division', group: 'Team', type: 'cat', hidden: true, desc: 'Division.'},
    {key: 'record', label: 'Record', group: 'Team', width: 72, type: 'text', search: false, desc: 'Current record' + (nhl ? ' (W-L-OTL).' : '.')},
    {key: 'wp', label: 'Rating', group: 'Rating', fmt: 'pct:1', width: 78, heat: {center: 0.5}, desc: 'Chance of beating a league-average team on a neutral field.'},
    {key: 'title_wp', label: 'vs title odds', group: 'Rating', fmt: 'pct:1', width: 146, render: (v, t) => dotCell(t, dom), agg: null,
      desc: 'Blue: the rating. Orange: what title odds alone imply. The rating sits up to a quarter of the way from the game lines to the title odds.'},
    hasPts ? {key: 'pts', label: 'Points', group: 'Rating', fmt: 'signed:1', width: 66, desc: 'Point spread against an average team on a neutral field.'} : null,
    {key: 'd7', label: '7 days', group: 'Rating', get: t => t.d7 == null ? null : 100 * t.d7, fmt: 'signed:1', width: 66, cls: v => v > 0.05 ? 'up' : v < -0.05 ? 'down' : 'muted', desc: 'Change in the game-market rating over 7 days, percentage points.'},
    {key: 'trend', label: 'Last 30 days', group: 'Rating', get: t => t.spark.slice(-30).map(p => p[1]), spark: {w: 84, h: 18, kind: 'line'}, width: 100, desc: 'Game-market rating by day.'},
    {key: 'game_wp', label: 'Game lines', group: 'Breakdown', fmt: 'pct:1', hidden: false, desc: 'Rating from game prices alone, before title odds.'},
    {key: 'game_rank', label: 'Lines rank', group: 'Breakdown', fmt: 'int', firstDir: 1, agg: null, desc: 'Rank on game lines alone.'},
    {key: 'title_weight', label: 'Title weight', group: 'Breakdown', fmt: 'pct:0', desc: 'Share of the gap to the title-odds rating that is added.'},
    {key: 'games_weight', label: 'Games in fit', group: 'Breakdown', fmt: 'num:1', desc: 'Recent games in the fit, age-weighted.'},
  ];
  if (sim) cols.push(
    {key: 'proj', label: nhl ? 'Proj pts' : 'Proj W', group: 'Season', get: t => nhl ? t.sim.pts : t.sim.w, fmt: nhl ? 'int' : 'num:1', width: 70, desc: `Average final ${nhl ? 'points' : 'wins'} across ${o.sims.toLocaleString()} simulated seasons.`},
    {key: 'playoff', label: 'Playoffs', group: 'Season', get: t => t.sim.playoff, fmt: 'pct:0', bar: {domain: [0, 1]}, width: 92, desc: 'Chance of making the playoffs, simulated.' + (key === 'nba' ? ' Includes coming through the play-in.' : '')},
    {key: 'playoff_p', label: 'Kalshi', group: 'Season', fmt: 'pct:0', width: 62, desc: 'Kalshi\'s price to make the playoffs.'},
    lg.teams.some(t => t.sim.div != null) ? {key: 'divwin', label: 'Division', group: 'Season', get: t => t.sim.div, fmt: 'pct:0', width: 70, desc: 'Chance of winning the division, simulated.'} : null,
    {key: 'top', label: 'Top seed', group: 'Season', get: t => t.sim.top, fmt: 'pct:0', width: 74, desc: 'Chance of the conference\'s top seed, simulated.'},
    {key: 'title_p', label: 'Title', group: 'Season', fmt: 'pct:1', width: 64, desc: 'Market chance of winning the championship.'},
    ...o.seeds.map((s, k) => ({key: 'seed' + k, label: /^\d+$/.test(s) ? '#' + s : s, group: 'Seeds', get: t => t.sim.seeds[k], fmt: 'pct:0', width: 50, heat: {type: 'seq', domain: [0, 1]}, desc: `Chance of finishing ${seedName(lg, k)}.`})));
  cols.push({key: 'inj', label: 'Key players out', group: 'News', type: 'text', width: 230, get: t => (t.injuries || []).map(injText).join(', '),
    render: (v, t) => (t.injuries || []).length ? `<span class="pw-inj">${t.injuries.slice(0, 3).map(i => `<span class="${i.out ? '' : 'q'}">${esc(injText(i))}</span>`).join(', ')}${t.injuries.length > 3 ? ` +${t.injuries.length - 3}` : ''}</span>` : '<span class="muted">–</span>',
    desc: 'Leading players ruled out, doubtful or on injured reserve; a question mark means questionable or day-to-day.'});
  return cols.filter(Boolean);
}
const GROUPS_DEF = [['Team'], ['Rating'], ['Breakdown', true], ['Season'], ['Seeds', true], ['News']].map(([id, hidden]) => ({id, label: id, hidden: !!hidden}));

/* ───────── season outlook ───────── */
function outlook(lg, key) {
  const o = lg.outlook;
  if (!o || !lg.teams.every(t => t.sim)) return null;
  const groups = GROUPS[key] || [['Places', o.seeds.length]];
  const confs = [...new Set(lg.teams.map(t => t.conf))].sort();
  const table = conf => {
    const teams = lg.teams.filter(t => t.conf === conf).sort((a, b) => b.sim.playoff - a.sim.playoff || (b.sim.pts ?? b.sim.w) - (a.sim.pts ?? a.sim.w));
    return `<div class="sh-tbl-wrap"><table class="pw-out"><thead>
      <tr class="grp"><th class="l"></th><th colspan="2"></th>${groups.map(([n, s]) => `<th colspan="${s}">${esc(n)}</th>`).join('')}<th colspan="3"></th></tr>
      <tr><th class="l">${esc(conf)}</th><th>Record</th><th title="Average final record across the simulations">Proj.</th>${o.seeds.map(s => `<th style="text-align:center">${esc(s)}</th>`).join('')}<th>Playoffs</th><th title="Kalshi's price to make the playoffs">Kalshi</th><th>Title</th></tr></thead><tbody>` +
      teams.map(t => { const top = Math.max(...t.sim.seeds);
        return `<tr class="go" data-abbr="${esc(t.abbr)}"><td class="l">${mark(t)}</td><td>${esc(t.record || '–')}</td><td>${record(t.sim)}</td>${t.sim.seeds.map(p => `<td class="sd${p === top && p >= 0.2 ? ' hi' : ''}" style="--p:${Math.min(1, p * 1.1).toFixed(3)}" title="${(100 * p).toFixed(1)}%">${p >= 0.995 ? '100' : p >= 0.005 ? Math.round(100 * p) : p > 0 ? '<span class="muted">&lt;1</span>' : ''}</td>`).join('')}<td><b>${pct(t.sim.playoff, 0)}</b></td><td>${pct(t.playoff_p, 0)}</td><td>${t.title_p == null ? '–' : t.title_p < 0.003 ? '&lt;0.3%' : pct(t.title_p)}</td></tr>`;
      }).join('') + '</tbody></table></div>';
  };
  const el = h('div', {class: 'sh-cols', html: confs.map(c => `<div class="pw-card">${table(c)}</div>`).join('')});
  el.addEventListener('click', e => { const r = e.target.closest('tr[data-abbr]'); if (r) openTeam(key, r.dataset.abbr); });
  return h('section', {class: 'sh-section'},
    h('h2', {class: 'sh-h', text: 'Season outlook'}),
    h('p', {class: 'sh-note', text: `The rest of the regular season played out ${o.sims.toLocaleString()} times from these ratings: ${o.games_left} games, ${o.priced} of them at their market price. Cells are the chance, in percent, of finishing in each place; darker is more likely.${key === 'nba' ? ' Places 7 to 10 enter the play-in; Playoffs counts the teams that come through it.' : ''}`}), el);
}

/* ───────── next games ───────── */
function gamesList(lg, key, limit) {
  const team = byAbbr(lg), list = lg.games.slice(0, limit || 99);
  if (!list.length) return h('p', {class: 'sh-note', text: 'No priced games in the look-ahead window.'});
  return h('div', {html: `<div class="pw-g hd"><span class="c-when">Start</span><span>Game</span><span class="n">Market: home wins</span><span class="n c-rt">Ratings</span><span class="n">Gap</span></div>` +
    list.map(g => { const d = g.model - g.consensus;
      return `<div class="pw-g"><span class="c-when muted">${esc(whenShort(g.start_utc))}</span><span>${mark(team[g.away] || {abbr: g.away})}<span class="at">${g.neutral ? 'vs' : 'at'}</span>${mark(team[g.home] || {abbr: g.home})}</span>` +
        `<span class="pw-pb"><span><i style="width:${(100 * g.consensus).toFixed(1)}%"></i></span><b>${pct(g.consensus)}</b></span><span class="n c-rt">${pct(g.model)}</span><span class="n ${Math.abs(d) < 0.03 ? 'muted' : ''}">${signed(100 * d)}</span></div>`;
    }).join('')});
}

/* ───────── team card ───────── */
let curGrid = null, openId = null;
function openTeam(key, abbr, nav) {
  const lg = state.data && state.data.leagues[key]; if (!lg) return;
  const t = lg.teams.find(x => x.abbr === abbr); if (!t) return;
  const sheet = wb.sheet(key);
  if (sheet && sheet.get('team') !== abbr) sheet.set({team: abbr});
  openId = key + ':' + abbr;
  const team = byAbbr(lg), sim = t.sim;
  const next = lg.games.filter(g => g.home === t.abbr || g.away === t.abbr).slice(0, 4);
  const facts = [['Rating', pct(t.wp)], ['Game lines alone', `${pct(t.game_wp)} (rank ${t.game_rank})`],
    ['Title odds imply', t.title_wp != null ? pct(t.title_wp) : 'no usable price'], ['Weight on title odds', pct(t.title_weight, 0)],
    t.pts != null && ['Against an average team', `${signed(t.pts)} points`],
    sim && ['Projected record', record(sim) + (sim.pts != null ? `, ${Math.round(sim.pts)} points` : '')], ['Playoffs, Kalshi', pct(t.playoff_p, 0)],
    ['Title odds', pct(t.title_p)], ['Recent games in the fit', `${t.games_weight.toFixed(1)} (age-weighted)`]].filter(Boolean);
  S.drawer.open({
    title: t.name, icon: mark(t, {size: 40, abbr: false}),
    sub: `#${t.rank} in the ${lg.label} · ${t.div || t.conf || ''}${t.record ? ' · ' + t.record : ''}`,
    keepScroll: true, nav: nav || (curGrid ? {prev: () => curGrid.step(-1), next: () => curGrid.step(1)} : null),
    onClose: () => { openId = null; if (sheet) sheet.set({team: null}); },
    body: el => {
      el.append(S.tiles([
        {label: 'Rating', value: pct(t.wp), sub: t.d7 != null ? `${signed(100 * t.d7)} in 7 days` : ''},
        t.pts != null ? {label: 'Points', value: signed(t.pts), sub: 'vs average'} : null,
        sim ? {label: 'Projected', value: record(sim), sub: key === 'nhl' && sim.pts != null ? Math.round(sim.pts) + ' points' : 'final record'} : null,
        sim ? {label: 'Playoffs', value: pct(sim.playoff, 0), sub: `Kalshi ${pct(t.playoff_p, 0)}`} : null,
        {label: 'Title', value: pct(t.title_p), sub: 'market'},
      ].filter(Boolean).slice(0, 4)));
      const pts = t.spark;
      if (pts.length > 1) {
        el.append(h('h3', {class: 'sh-h', text: `Game-market rating, last ${pts.length} days`}));
        S.line(el.appendChild(h('div')), {series: [{name: 'Rating', points: pts.map((p, i) => [i, p[1]])}], height: 150, yFmt: 'pct:0', xFmt: i => pts[Math.round(i)] ? day(pts[Math.round(i)][0]) : '', hlines: [{y: 0.5, label: 'average'}], endLabels: false});
      }
      if (sim && lg.outlook) {
        el.append(h('h3', {class: 'sh-h', text: 'Where the season ends, simulated'}));
        S.bar(el.appendChild(h('div')), {data: sim.seeds.map((p, k) => ({label: lg.outlook.seeds[k].replace(/^(\d+)$/, 'Seed $1'), value: p})).concat([{label: 'Below these', value: Math.max(0, 1 - sim.seeds.reduce((a, b) => a + b, 0))}]), fmt: 'pct:0', diverging: false});
      }
      if ((t.injuries || []).length) {
        el.append(h('h3', {class: 'sh-h', text: 'Key players on the injury report'}),
          h('ul', {class: 'pw-list', html: t.injuries.map(i => `<li><span>${esc(i.name)}, ${esc(i.pos)} <span class="muted">${esc(i.role || '')}</span></span><span class="${i.out ? '' : 'muted'}">${esc([i.status, lower(i.part)].filter(Boolean).join(', '))}</span></li>`).join('')}));
      }
      if (next.length) {
        el.append(h('h3', {class: 'sh-h', text: 'Next games'}), h('ul', {class: 'pw-list', html: next.map(g => {
          const home = g.home === t.abbr, opp = team[home ? g.away : g.home] || {abbr: home ? g.away : g.home}, p = home ? g.consensus : 1 - g.consensus;
          return `<li><span>${esc(whenShort(g.start_utc))} <span class="muted">${home || g.neutral ? 'vs' : 'at'}</span> ${mark(opp, {name: true})}</span><span><b>${pct(p, 0)}</b> <span class="muted">to win</span></span></li>`;
        }).join('')}));
      }
      el.append(h('h3', {class: 'sh-h', text: 'Breakdown'}), S.kv(facts));
    },
  });
}

/* ───────── sheets ───────── */
function leagueSheet(key) {
  return async (panel, sheet) => {
    await ready;
    state.rendered.set(key, [panel, sheet]);
    panel.innerHTML = '';
    const lg = state.data.leagues[key];
    if (!lg) { panel.append(h('p', {class: 'sh-note', text: 'No data for this league yet.'})); return; }
    sheet.about(ABOUT[key]);
    if (lg.stale) panel.append(h('div', {class: 'pw-banner', text: `These ${lg.label} ratings were last rebuilt ${ago(lg.updated_utc)}. Too few games are priced right now (out of season), or the price sources were unreachable.`}));
    if ((lg.unrated || []).length) panel.append(h('div', {class: 'pw-banner', text: `No priced games found for ${lg.unrated.join(', ')}; shown at league average.`}));
    panel.append(kpis(lg), h('div', {class: 'pw-top'}, glance(lg, key), movers(lg, key)));
    const gridBox = h('section', {class: 'sh-section'},
      h('div', {class: 'pw-hd'}, h('h2', {class: 'sh-h', text: `${lg.label} rankings`})),
      h('div', {class: 'pw-legend', html: '<span><i style="background:var(--model)"></i>Rating</span><span><i style="background:var(--market)"></i>What title odds alone imply</span><span class="muted">Group chips show the breakdown and each seed. Click a column header to sort; hover it for the definition.</span>'}));
    panel.append(gridBox);
    const g = sheet.grid(gridBox, {columns: columns(lg, key), groups: GROUPS_DEF, rows: lg.teams, sort: 'rank', rowHeight: 32, height: 'auto', overscan: 400,
      label: `${lg.label} rankings`, csv: `power-${key}.csv`, searchPlaceholder: 'Search team or player', footer: false,
      onRowClick: t => { curGrid = g; openTeam(key, t.abbr, {prev: () => g.step(-1), next: () => g.step(1)}); }});
    const out = outlook(lg, key); if (out) panel.append(out);
    panel.append(h('section', {class: 'pw-card'},
      h('div', {class: 'pw-hd'}, h('h2', {class: 'sh-h', text: 'Next games'}), h('a', {href: '#sheet=games&f.lg==' + lg.label, text: 'Every venue\'s price →'})),
      h('p', {class: 'sh-note', text: 'Chance the home team wins: the market is the average of the venues; ratings is what the rankings predict. A wide gap usually means news the ratings have not caught up with.'}),
      gamesList(lg, key, 12)));
    const fromParams = () => { const a = sheet.get('team'); if (a && openId !== key + ':' + a) { curGrid = g; openTeam(key, a); } else if (!a && openId && openId.startsWith(key + ':')) S.drawer.close(); };
    if (!sheet._pwBound) { sheet._pwBound = true; sheet.onState(() => fromParams()); }
    fromParams();
  };
}
async function gamesSheet(panel, sheet) {
  await ready;
  state.rendered.set('games', [panel, sheet]);
  panel.innerHTML = '';
  sheet.about('<b>Upcoming games</b> <span class="fx-eq">=</span> chance the home team wins, by venue. Market is the average; Ratings is what the rankings predict. Filter League with the funnel on its header.');
  const rows = Object.entries(state.data.leagues).flatMap(([k, lg]) => { const tm = byAbbr(lg); return lg.games.map(g => Object.assign({}, g, {lg: lg.label, key: k, A: tm[g.away] || {abbr: g.away}, H: tm[g.home] || {abbr: g.home}})); });
  sheet.grid(panel, {rows, sort: 'start_utc', rowHeight: 30, csv: 'power-games.csv', searchPlaceholder: 'Search team', footer: false, label: 'Upcoming games',
    columns: [
      {key: 'lg', label: 'League', type: 'cat', width: 70, frozen: true, desc: 'League.'},
      {key: 'start_utc', label: 'Start', type: 'text', width: 150, render: v => esc(when(v)), search: false, firstDir: 1, desc: 'Start time, your time zone.'},
      {key: 'away', label: 'Away', type: 'text', width: 96, render: (v, g) => mark(g.A), desc: 'Away team (first-named on a neutral field).'},
      {key: 'home', label: 'Home', type: 'text', width: 96, render: (v, g) => mark(g.H) + (g.neutral ? ' <span class="muted">neutral</span>' : ''), desc: 'Home team.'},
      ...VENUES.map(v => ({key: v, label: SOURCE[v], group: 'Venues', get: g => g.sources[v] ?? null, fmt: 'pct:1', width: 92, desc: `${SOURCE[v]}: home team's win chance${v === 'kalshi' || v === 'polymarket' ? ' (middle of the order book)' : ' (margin removed by Shin\'s method)'}.`})),
      {key: 'consensus', label: 'Market', group: 'Compare', fmt: 'pct:1', width: 84, bar: {domain: [0, 1]}, desc: 'Average of the venues in log-odds.'},
      {key: 'model', label: 'Ratings', group: 'Compare', fmt: 'pct:1', width: 76, desc: 'What the power ratings predict for this game.'},
      {key: 'gap', label: 'Gap', group: 'Compare', get: g => 100 * (g.model - g.consensus), fmt: 'signed:1', width: 64, heat: {center: 0, domain: [-10, 10]}, desc: 'Ratings minus market, percentage points. Wide gaps usually mean news (injury, rest) the ratings have not caught up with.'},
    ]});
}
async function methodSheet(panel, sheet) {
  await ready;
  state.rendered.set('method', [panel, sheet]);
  panel.innerHTML = '';
  const data = state.data, keys = Object.keys(data.leagues);
  let key = keys.includes(sheet.get('lg')) ? sheet.get('lg') : keys[0];
  const body = h('div', {class: 'pw-method sh-md'});
  const seg = S.ui.segmented({label: 'League', options: keys.map(k => ({value: k, label: data.leagues[k].label})), value: key, onChange: v => { key = v; sheet.set({lg: v === keys[0] ? null : v}); draw(); }});
  const draw = () => { body.innerHTML = ''; body.append(...method(data.leagues[key], key, data)); };
  panel.append(S.ui.row(seg), body); draw();
}
function method(lg, key, data) {
  const p = (...kids) => h('p', null, ...kids), b = t => h('b', null, t), tt = lg.title;
  const srcLine = Object.entries(data.sources).filter(([k]) => k !== 'espn').map(([k, v]) => {
    const st = v[key] || {};
    return `${SOURCE[k]}: ${st.error ? 'failed (' + st.error + ')' : `${st.games ?? 0} games priced this run${st.title ? ', title odds' : ''}`}`;
  }).join(' · ');
  return [
    h('h2', {text: `How the ${lg.label} ratings are built`}),
    p(b('Game prices. '), 'For each game the home team\'s win probability is taken from Kalshi and Polymarket (the middle of the order book) and from Pinnacle and DraftKings (moneylines with the bookmaker\'s margin removed by Shin\'s method), then averaged in log-odds. A finished game keeps its last price before the start. ',
      `So far ${Object.entries(lg.coverage).map(([k, n]) => `${SOURCE[k]} has priced ${n}`).join(', ')} of the ${lg.label} games used.`),
    p(b('Ratings. '), `A regression finds the team ratings, the home advantage${lg.b2b ? ' and the back-to-back penalty' : ''} that best reproduce those prices. Upcoming games count in full and a played game's weight halves every ${lg.half_life_days} days, so a rating tracks the current lines. `,
      `Fitted home advantage: ${pct(lg.home_adv.wp)} for evenly matched teams.`, lg.b2b ? ` Second night of a back-to-back: ${signed(100 * lg.b2b.wp)} points of win probability.` : '',
      ` The ratings reproduce the priced games to within about ${(100 * lg.fit_rmse / 4).toFixed(1)} points of win probability.`),
    p(b('Title odds. '), tt.skipped ? `Not applied this run: ${tt.skipped}.` :
      `Championship prices from ${tt.sources.map(k => SOURCE[k]).join(', ')} are averaged and divided by Kalshi's price to make the playoffs. Across the ${tt.n} teams with a real title price, that conditional title chance rises with the game rating. A team above the line is rated higher by the futures market than by its game lines, which is what a long-term injury or a slow start looks like. Up to ${pct(tt.weight_max, 0)} of that gap is added to the rating, less for long shots. Teams whose title price sits at the minimum tick keep their game rating.`),
    lg.outlook ? p(b('Season outlook. '), `Every remaining regular-season game is played ${lg.outlook.sims.toLocaleString()} times. A game with a market price uses it; the rest use the ratings, the home advantage${lg.b2b ? ' and the back-to-back penalty' : ''}. Team strength is not held fixed: it drifts week to week as a random walk (${lg.outlook.drift} in log-odds a week, set from how fast the ratings have moved this season and from Kalshi's playoff prices), so late-season games are less certain than next week's. Standings are then seeded by the league's rules. Tie-breaks are simplified (record, then ${key === 'nhl' ? 'regulation wins' : key === 'nfl' ? 'division and conference record' : 'conference record'}, then a coin flip; no head-to-head).`,
      lg.outlook.playoff_gap != null ? ` Simulated playoff odds sit ${(100 * lg.outlook.playoff_gap).toFixed(0)} points from Kalshi's playoff prices on a typical team; both are shown so the gaps are visible.` : '',
      key === 'nba' ? ' The two games each NBA team plays after the in-season cup are not scheduled yet and are left out.' : '') : null,
    p(b('Key players out. '), key === 'nfl' ? 'A team\'s passing leader, rushing leader and top two receivers by yards' : key === 'nba' ? 'A team\'s top three scorers per game' : 'A team\'s top three point scorers and its busiest goalie',
      ', from ESPN\'s season statistics, checked against ESPN\'s injury report. Listed when out, doubtful or on injured reserve; a question mark marks questionable or day-to-day. It is a pointer to why a rating moved, not an input to it.'),
    p(b('Reading it. '), 'Game lines carry injuries, rest and starting goalies or quarterbacks, so a rating can dip for a week and recover. The 7-day change and the trend use game lines only. Days before this page started updating were rebuilt from closing prices.',
      lg.points_sd ? ` Points convert win probability at DraftKings' own spread-to-moneyline rate (a standard deviation of ${lg.points_sd.toFixed(1)}).` : ''),
    h('p', {class: 'pw-src', text: srcLine}),
    h('p', {class: 'pw-src', text: 'Research, not advice. Prices are public quotes from the venues named; nothing here places or recommends a bet.'}),
  ].filter(Boolean);
}

/* ───────── data ───────── */
// The hourly job commits data/power.json to main. The copy served with the page waits for a Pages deploy; the raw
// file on main is current within five minutes of the push. Read both and use the newer.
function sources() {
  const urls = ['data/power.json?t=' + Math.floor(Date.now() / 300000)];
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/), repo = location.pathname.split('/')[1];
  if (m && repo) urls.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/main/docs/power/data/power.json`);
  return urls;
}
let gotData;
const ready = new Promise(r => { gotData = r; });
async function fetchData() {
  const got = await Promise.all(sources().map(u => fetch(u, {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null)));
  const best = got.filter(d => d && d.generated_utc && d.leagues).sort((a, b) => b.generated_utc.localeCompare(a.generated_utc))[0];
  if (!best) { if (!state.data) throw new S.LoadError('data/power.json', 'not found or unreadable. Run python -m beating.power build.'); return; }
  if (state.data && best.generated_utc <= state.data.generated_utc) return;
  const first = !state.data;
  state.data = best; stamp();
  if (first) { gotData(); return; }
  for (const [id, [panel, sheet]] of state.rendered) sheet.def.render(panel, sheet);   // hourly rebuild arrived
}
function stamp() {
  const d = state.data; if (!d) return;
  const hours = (Date.now() - new Date(d.generated_utc)) / 3.6e6;
  wb.setStamp(`Updated ${ago(d.generated_utc)}${hours > 3 ? ' (stale)' : ''} · ${new Date(d.generated_utc).toLocaleString(undefined, {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})}`);
}

const wb = S.workbook({
  title: 'Power rankings', subtitle: 'NFL, NBA and NHL ratings read off game prices at Kalshi, Polymarket, Pinnacle and DraftKings, rebuilt hourly',
  doc: 'power', defaultSheet: 'nfl', stamp: 'Loading prices…',
  sheets: [
    ...LEAGUES.map(([k, n]) => ({id: k, name: n, render: leagueSheet(k)})),
    {id: 'games', name: 'Games', fill: true, render: gamesSheet},
    {id: 'method', name: 'Method', render: methodSheet},
  ],
});
fetchData().catch(e => { console.error(e); wb.setStamp('Could not load prices'); gotData(); });
ready.then(() => { if (!state.data) for (const s of wb.sheets) { s.panel.innerHTML = ''; s.panel.append(S.errorEl(new S.LoadError('data/power.json', 'not found or unreadable'))); } });
setInterval(() => fetchData().catch(() => {}), 600000);   // pick up the hourly rebuild without a reload
setInterval(stamp, 60000);                                  // keep "updated n min ago" current
</script>
