name: Research checks
on:
  push:
  pull_request:
jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
